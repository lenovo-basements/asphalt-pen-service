# asphalt-pen policy; apply changes with `sudo asphalt-pen sync`.

# auto: pen mode while a Bluetooth pen below is connected (like stock Android)
# on:   always (a pen without Bluetooth, or testing)
# off:  never
MODE=auto

# Case-insensitive globs on the Bluetooth input device name, as in
# `asphalt-pen status` or /proc/bus/input/devices.
PENS="*pen*"

# y700-hapticd effect when pen mode turns on; empty for none.
HAPTIC=toggle
